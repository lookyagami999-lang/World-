<!DOCTYPE html>
 <html lang="th">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>เข้าสู่ระบบ — เจ้าหน้าที่</title>
   <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
   <style>
     * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
     body { background: linear-gradient(135deg, #008891, #00a86b); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
     .card { background: white; border-radius: 16px; padding: 30px 24px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
     h2 { text-align: center; color: #333; margin-bottom: 24px; }
     .form-group { margin-bottom: 16px; }
     label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
     input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
     button { width: 100%; padding: 13px; background: #008891; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
     button:hover { background: #007077; }
     .back { text-align: center; margin-top: 16px; }
     .back a { color: #008891; text-decoration: none; font-size: 14px; }
     #msg { margin-top:12px; text-align:center; display:none; font-size:14px; }
   </style>
 </head>
 <body>
   <div class="card">
     <h2>🔐 เข้าสู่ระบบเจ้าหน้าที่</h2>
     <div class="form-group">
       <label>อีเมล</label>
       <input type="email" id="email" placeholder="admin@example.com">
     </div>
     <div class="form-group">
       <label>รหัสผ่าน</label>
       <input type="password" id="password" placeholder="••••••••">
     </div>
     <button onclick="login()">เข้าสู่ระบบ</button>
     <p id="msg"></p>
     <div class="back">
       <a href="index.html">← กลับหน้าแรก</a>
     </div>
   </div>
   <script>
     // ใส่ Firebase Config ตรงนี้เหมือนกับไฟล์แรก
     const firebaseConfig = {
       apiKey: "AIzaSyC8tQ0HhXZ5qIeKtXzY5wQbXmPvZbXmPvZbXmPvZbXmPv",
       authDomain: "headlight-complaint.firebaseapp.com",
       databaseURL: "https://headlight-complaint-default-rtdb.asia-southeast1.firebasedatabase.app/",
       projectId: "headlight-complaint",
       storageBucket: "headlight-complaint.appspot.com",
       messagingSenderId: "123456789012",
       appId: "1:123456789012:web:abc123def456ghi789jkl01"
     };
     const app = firebase.initializeApp(firebaseConfig);
     function login() {
       const email = document.getElementById('email').value;
       const pass = document.getElementById('password').value;
       const msg = document.getElementById('msg');
       if (!email || !pass) {
         msg.textContent = "⚠️ กรอกอีเมลและรหัสผ่าน";
         msg.style.color = "orange";
         msg.style.display = "block";
         return;
       }
       firebase.auth().signInWithEmailAndPassword(email, pass)
         .then(() => {
           window.location.href = "admin.html";
         })
         .catch((err) => {
           msg.textContent = "❌ " + err.message;
           msg.style.color = "red";
           msg.style.display = "block";
         });
     }
   </script>
 </body>
 </html>
